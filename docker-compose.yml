services:
  docs-hub:
    # Pinned release. To upgrade, set SELFDOCHUB_VERSION in .env (or edit the tag here), then run
    # `docker compose pull && docker compose up -d`. Tags: https://hub.docker.com/r/selfdochub/selfdochub/tags
    image: selfdochub/selfdochub:${SELFDOCHUB_VERSION:-1.1.0}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Published to loopback only: put your own reverse proxy (Nginx, Caddy) with TLS in front.
      - "127.0.0.1:8080:8080"
    volumes:
      - docs-hub-data:/data

volumes:
  docs-hub-data:
